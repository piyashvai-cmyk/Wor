<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In · MAHIR ID Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #08090f;
    --bg-1: #0f1119;
    --bg-2: #161a26;
    --card: rgba(22, 26, 38, 0.7);
    --border: rgba(255, 255, 255, 0.08);
    --border-hi: rgba(255, 255, 255, 0.16);
    --text-0: #f5f7ff;
    --text-1: #a8b0c2;
    --text-2: #6b7385;
    --accent: #ffb02e;
    --accent-hi: #ffd166;
    --accent-glow: rgba(255, 176, 46, 0.4);
    --danger: #ff4d6d;
    --success: #22e5a5;
    --info: #38bdf8;
    --owner: #ec4899;
    --user: #06b6d4;
    --radius: 14px;
    --radius-lg: 20px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-0);
    color: var(--text-0);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── Ambient background ─── */
  .bg-orbs {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.35;
    animation: float 20s ease-in-out infinite;
  }
  .orb-1 { width: 500px; height: 500px; background: #ff6b35; top: -150px; left: -150px; }
  .orb-2 { width: 450px; height: 450px; background: #4f46e5; bottom: -150px; right: -100px; animation-delay: -7s; }
  .orb-3 { width: 350px; height: 350px; background: #ec4899; top: 40%; left: 60%; animation-delay: -14s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(50px, -40px) scale(1.1); }
    66%      { transform: translate(-40px, 30px) scale(0.95); }
  }

  .grid-bg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
  }

  /* ─── Card ─── */
  .login-wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--card);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 40px 34px;
    box-shadow:
      0 1px 0 0 rgba(255,255,255,0.06) inset,
      0 40px 80px -20px rgba(0,0,0,0.7);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,176,46,0.5), transparent);
  }

  /* ─── Brand ─── */
  .brand {
    text-align: center;
    margin-bottom: 32px;
  }
  .brand-logo {
    width: 64px; height: 64px;
    margin: 0 auto 16px;
    border-radius: 18px;
    background: linear-gradient(135deg, #ff6b35, #ffb02e 50%, #ffd166);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 12px 32px -8px var(--accent-glow), 0 0 0 1px rgba(255,255,255,0.1) inset;
    position: relative;
  }
  .brand-logo::after {
    content: '';
    position: absolute;
    inset: 2px;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(255,255,255,0.25), transparent);
    pointer-events: none;
  }
  .brand-logo svg { width: 34px; height: 34px; color: #0a0a0a; position: relative; z-index: 1; }

  .brand h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
    background: linear-gradient(135deg, #fff, #a8b0c2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .brand p {
    font-size: 13px;
    color: var(--text-2);
    font-family: 'JetBrains Mono', monospace;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
  }
  .brand p .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); box-shadow: 0 0 8px var(--success); }

  /* ─── Role Tabs ─── */
  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    padding: 5px;
    background: rgba(0,0,0,0.35);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 26px;
    position: relative;
  }
  .tab {
    padding: 11px;
    text-align: center;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-2);
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    user-select: none;
    position: relative;
    z-index: 1;
  }
  .tab svg { width: 15px; height: 15px; }
  .tab.active { color: #0a0a0a; }
  .tab.active[data-role="user"]  { background: linear-gradient(135deg, var(--user), #0891b2); color: #fff; box-shadow: 0 6px 18px -4px rgba(6,182,212,0.5); }
  .tab.active[data-role="owner"] { background: linear-gradient(135deg, var(--owner), #be185d); color: #fff; box-shadow: 0 6px 18px -4px rgba(236,72,153,0.5); }
  .tab:not(.active):hover { color: var(--text-0); background: rgba(255,255,255,0.03); }

  /* ─── Form ─── */
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-1);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .input-wrap { position: relative; }
  .input-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-2);
    pointer-events: none;
    transition: color 0.2s;
  }
  .input-icon svg { width: 17px; height: 17px; display: block; }
  .field input {
    width: 100%;
    padding: 13px 14px 13px 42px;
    border-radius: 11px;
    border: 1px solid var(--border);
    background: rgba(0,0,0,0.3);
    color: var(--text-0);
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
    transition: all 0.2s;
  }
  .field input::placeholder { color: var(--text-2); }
  .field input:focus {
    border-color: var(--accent);
    background: rgba(0,0,0,0.45);
    box-shadow: 0 0 0 4px rgba(255,176,46,0.12);
  }
  .field input:focus + .input-icon,
  .field input:focus ~ .input-icon { color: var(--accent); }

  /* ─── Button ─── */
  .btn-submit {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 11px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    background: linear-gradient(135deg, #ff6b35, #ffb02e);
    color: #0a0a0a;
    margin-top: 8px;
    position: relative;
    overflow: hidden;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 10px 30px -8px var(--accent-glow);
  }
  .btn-submit svg { width: 18px; height: 18px; }
  .btn-submit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 15px 40px -8px var(--accent-glow); }
  .btn-submit:active:not(:disabled) { transform: translateY(0); }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

  .btn-submit .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(0,0,0,0.25);
    border-top-color: #0a0a0a;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── Alert ─── */
  .alert {
    margin-top: 18px;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .alert svg { width: 17px; height: 17px; flex-shrink: 0; }
  .alert.error { background: rgba(255,77,109,0.1); border: 1px solid rgba(255,77,109,0.25); color: #ff8fa8; }
  .alert.success { background: rgba(34,229,165,0.1); border: 1px solid rgba(34,229,165,0.25); color: #6ff0c4; }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ─── Footer ─── */
  .footer {
    text-align: center;
    margin-top: 22px;
    font-size: 11.5px;
    color: var(--text-2);
    font-family: 'JetBrains Mono', monospace;
  }

  @media (max-width: 480px) {
    .card { padding: 30px 22px; }
    .brand h1 { font-size: 19px; }
  }
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="login-wrap">
  <div class="card">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
      </div>
      <h1>MAHIR ID GENERATOR</h1>
      <p><span class="dot"></span> Free Fire OB55 · BD Server</p>
    </div>

    <div class="tabs">
      <div class="tab active" data-role="user">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        User
      </div>
      <div class="tab" data-role="owner">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/>
        </svg>
        Owner
      </div>
    </div>

    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap">
          <input type="text" id="username" placeholder="Enter your username" required autocomplete="username">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
        </div>
      </div>

      <button class="btn-submit" id="btn" type="submit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Sign In
      </button>
    </form>

    <div id="alertBox"></div>

    <div class="footer">v2.132.8 · OB55 · BD Only</div>
  </div>
</div>

<script>
  let role = 'user';
  const tabs = document.querySelectorAll('.tab');

  tabs.forEach(t => t.addEventListener('click', () => {
    tabs.forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    role = t.dataset.role;
    document.getElementById('alertBox').innerHTML = '';
  }));

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn');
    const box = document.getElementById('alertBox');
    box.innerHTML = '';

    const originalHTML = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Authenticating…';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value.trim(),
          role,
        })
      });
      const data = await res.json();

      if (data.ok) {
        btn.innerHTML = '✓ Success — Redirecting…';
        box.innerHTML = `
          <div class="alert success">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            Welcome back! Redirecting to dashboard…
          </div>`;
        setTimeout(() => window.location.href = '/dashboard', 500);
      } else {
        btn.disabled = false;
        btn.innerHTML = originalHTML;
        box.innerHTML = `
          <div class="alert error">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            ${data.error || 'Invalid credentials'}
          </div>`;
      }
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = originalHTML;
      box.innerHTML = `
        <div class="alert error">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          Network error. Please try again.
        </div>`;
    }
  });
</script>
</body>
</html>
